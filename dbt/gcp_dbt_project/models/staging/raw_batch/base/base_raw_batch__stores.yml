version: 2

models:
  - name: base_raw_batch__stores
    description: Stores from raw_batch with clean structure.
    columns:
      - name: store_id
        description: Unique identifier for each store.
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: store_name
        description: Store name.
        data_type: string

      - name: store_opened_at
        description: Timestamp when the store was opened.
        data_type: timestamp

      - name: store_tax_rate_percentage
        description: Tax rate applied in the store, as a percentage.
        data_type: float64