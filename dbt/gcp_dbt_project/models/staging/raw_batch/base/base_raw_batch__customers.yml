version: 2

models:
  - name: base_raw_batch__customers
    description: Customers from raw_batch with clean structure
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        data_type: string
        tests:
          - not_null
          - unique
          
      - name: customer_name
        description: Customer name. PII.
        data_type: string