version: 2

sources:
  - name: raw_streaming
    schema: raw_streaming
    description: E-commerce streaming example data.
    freshness:
      warn_after:
        count: 24
        period: hour
    tables:
      - name: orders
        description: One record per order (consisting of one or more order items).
        loaded_at_field: pubsub_event_timestamp
      - name: items
        description: Items included in an order.
        loaded_at_field: pubsub_event_timestamp
