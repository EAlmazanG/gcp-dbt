version: 2

models:
  - name: int_fact_orders
    description: Enriched fact table for orders, including customer category and store information.
    columns:
      - name: order_id
        description: Unique identifier for each order.
        data_type: string
        tests:
          - not_null
          - unique

      - name: store_id
        description: Identifier of the store where the order was placed.
        data_type: string
        tests:
          - not_null

      - name: store_name
        description: Name of the store where the order was placed.
        data_type: string

      - name: customer_id
        description: Identifier of the customer placing the order.
        data_type: string
        tests:
          - not_null

      - name: customer_category
        description: Classification of the customer based on order behavior and recency.
        data_type: string

      - name: ordered_at
        description: Timestamp when the order was placed.
        data_type: timestamp
        tests:
          - not_null

      - name: order_subtotal_eur
        description: Order subtotal amount in euros (excluding tax).
        data_type: float64

      - name: order_tax_paid_eur
        description: Tax amount paid for the order in euros.
        data_type: float64

      - name: order_total_eur
        description: Total amount of the order in euros (including tax).
        data_type: float64

      - name: total_order_cost_eur
        description: Total cost of the order based on supplies.
        data_type: float64

      - name: total_order_revenue_eur
        description: Estimated revenue from the order.
        data_type: float64

      - name: total_order_profit_eur
        description: Profit made from the order.
        data_type: float64

      - name: number_order_items
        description: Number of items included in the order.
        data_type: int64

      - name: number_order_perishable_items
        description: Number of perishable items included in the order.
        data_type: int64

      - name: customer_order_number
        description: Sequential number of the order for the customer.
        data_type: int64
