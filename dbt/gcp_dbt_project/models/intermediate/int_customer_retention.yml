version: 2

models:
  - name: int_customer_retention
    description: Checks whether each customer placed at least one order in every month from their first order to the dataset's current date.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        data_type: string
        tests:
          - not_null
          - unique

      - name: has_order_every_month
        description: Indicates if the customer placed an order in every month from their first order to the dataset's current date.
        data_type: boolean

      - name: day_first_customer_transaction
        description: Date of the customer's first order.
        data_type: date

      - name: day_last_customer_transaction
        description: Date of the customer's last order.
        data_type: date

      - name: week_first_customer_transaction
        description: Start of the week of the customer's first order.
        data_type: date

      - name: week_last_customer_transaction
        description: Start of the week of the customer's last order.
        data_type: date

      - name: month_first_customer_transaction
        description: First month (start date) in which the customer placed an order.
        data_type: date

      - name: month_last_customer_transaction
        description: Latest month considered in the dataset (based on dataset current date).
        data_type: date
